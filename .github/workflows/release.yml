name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build:
    runs-on: [self-hosted, linux-x64]
    env:
      BUILD_TARGET: x86_64-unknown-linux-gnu
      ARTIFACT_SUFFIX: linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.BUILD_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ env.BUILD_TARGET }}
          cache-directories: target

      - uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build release
        run: cargo build --release --target ${{ env.BUILD_TARGET }}
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"

      - name: Package
        shell: bash
        run: |
          cd target/${{ env.BUILD_TARGET }}/release
          tar czf ../../../duckwire-${{ env.ARTIFACT_SUFFIX }}.tar.gz duckwire
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: duckwire-${{ env.ARTIFACT_SUFFIX }}
          path: duckwire-${{ env.ARTIFACT_SUFFIX }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
