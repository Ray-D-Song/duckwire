[package]
name = "duckwire"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "duckwire"
path = "src/main.rs"

[dependencies]
arrow = "58"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive"] }
duckdb = "1.10502.0"
futures = "0.3"
pgwire = "0.39.0"
polyglot-sql = "0.3.3"
thiserror = "2"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "net", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
